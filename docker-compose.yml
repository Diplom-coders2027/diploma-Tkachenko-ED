version: '3.8'

# ==============================================================================
# Стартовая конфигурация Docker Compose для дипломного проекта
# Настройте сервисы под ваш стек технологий (бэкенд, фронтенд, базы данных)
# ==============================================================================

services:
  # Основной сервис разрабатываемого приложения
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diploma_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy

  # Базовый сервис базы данных (пример: PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: diploma_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diploma_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-diploma_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
